{% extends 'base.html' %}{% block body %}<h4>Account settings</h4><form method="post" class="card p-3" style="max-width:420px"><input type="hidden" name="csrf" value="{{ csrf }}">
<label class="form-label">Current password</label><input type="password" name="old" class="form-control mb-2" required>
<label class="form-label">New password (min 8 characters)</label><input type="password" name="new" class="form-control mb-3" minlength="8" required><button class="btn btn-primary">Change password</button></form>{% endblock %}
